plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "provisuals" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def lyricsJar = layout.buildDirectory.file("generated/provisuals-resources/META-INF/jars/lyrics-in-the-sky.jar")
def lyricsUrl = "https://github.com/Henner4746/lyrics-in-the-sky/releases/download/v1.3.0-dev.24/lyrics-in-the-sky-1.3.0-dev.24%2Bmc26.3.jar"
def lyricsSha256 = "730dd5c8efb97efa0b5868d9af213efe05eea686415aac6da924c1f5abf1e812"

tasks.register("downloadLyricsModule") {
    outputs.file(lyricsJar)
    doLast {
        File destination = lyricsJar.get().asFile
        destination.parentFile.mkdirs()
        if (!destination.exists()) {
            new URI(lyricsUrl).toURL().withInputStream { input ->
                destination.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        String actual = digest.digest(destination.bytes).collect { String.format("%02x", it) }.join()
        if (actual != lyricsSha256) {
            destination.delete()
            throw new GradleException("Lyrics in the Sky checksum mismatch. Expected ${lyricsSha256}, got ${actual}")
        }
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/provisuals-resources"))

def blackHoleSkyTexture = layout.buildDirectory.file("generated/provisuals-resources/assets/provisuals/textures/sky/black_hole.png")
tasks.register("generateBlackHoleSkyTexture") {
    outputs.file(blackHoleSkyTexture)
    doLast {
        File destination = blackHoleSkyTexture.get().asFile
        destination.parentFile.mkdirs()

        final int faceSize = 768
        def atlas = new java.awt.image.BufferedImage(faceSize * 3, faceSize * 2,
                java.awt.image.BufferedImage.TYPE_INT_ARGB)

        // Nuit's 3x2 cubemap layout: bottom, north, south, top, east, west.
        def faces = [
                [0, 0, -1d, -1d, -1d,  2d, 0d, 0d,  0d, 0d, 2d],
                [1, 1, -1d,  1d, -1d,  2d, 0d, 0d,  0d,-2d, 0d],
                [2, 0,  1d,  1d,  1d, -2d, 0d, 0d,  0d,-2d, 0d],
                [1, 0, -1d,  1d,  1d,  2d, 0d, 0d,  0d, 0d,-2d],
                [2, 1,  1d,  1d, -1d,  0d, 0d, 2d,  0d,-2d, 0d],
                [0, 1, -1d,  1d,  1d,  0d, 0d,-2d,  0d,-2d, 0d]
        ]

        double cx = 0.0d, cy = 0.28d, cz = -0.96d
        double cn = Math.sqrt(cx*cx + cy*cy + cz*cz)
        cx /= cn; cy /= cn; cz /= cn
        // A stable camera-up tangent basis around the black-hole direction.
        double rx = -cz, ry = 0.0d, rz = cx
        double rn = Math.sqrt(rx*rx + ry*ry + rz*rz)
        rx /= rn; ry /= rn; rz /= rn
        double ux = ry*cz - rz*cy
        double uy = rz*cx - rx*cz
        double uz = rx*cy - ry*cx
        double un = Math.sqrt(ux*ux + uy*uy + uz*uz)
        ux /= un; uy /= un; uz /= un

        def clampByte = { double v -> (int)Math.max(0d, Math.min(255d, v)) }
        for (int faceIndex = 0; faceIndex < faces.size(); faceIndex++) {
            def f = faces[faceIndex]
            int tileX = (int)f[0], tileY = (int)f[1]
            double ox=f[2], oy=f[3], oz=f[4]
            double ax=f[5], ay=f[6], az=f[7]
            double bx=f[8], by=f[9], bz=f[10]

            for (int py = 0; py < faceSize; py++) {
                double v = (py + 0.5d) / faceSize
                for (int px = 0; px < faceSize; px++) {
                    double u = (px + 0.5d) / faceSize
                    double dx = ox + ax*u + bx*v
                    double dy = oy + ay*u + by*v
                    double dz = oz + az*u + bz*v
                    double length = Math.sqrt(dx*dx + dy*dy + dz*dz)
                    dx /= length; dy /= length; dz /= length

                    double forward = dx*cx + dy*cy + dz*cz
                    double tx = Math.atan2(dx*rx + dy*ry + dz*rz, forward)
                    double ty = Math.atan2(dx*ux + dy*uy + dz*uz, forward)
                    double dist = Math.sqrt(tx*tx + ty*ty)

                    // Slow diagonal accretion plane with a bright, uneven inner rim.
                    double tilt = 0.25d
                    double angle = Math.toRadians(17d)
                    double qx = tx*Math.cos(angle) + ty*Math.sin(angle)
                    double qy = -tx*Math.sin(angle) + ty*Math.cos(angle)
                    double ellipse = Math.sqrt(qx*qx + (qy/tilt)*(qy/tilt))
                    double ringCore = Math.exp(-Math.pow((ellipse-0.53d)/0.085d, 2d))
                    double ringInner = Math.exp(-Math.pow((ellipse-0.36d)/0.055d, 2d))*0.24d
                    double ringOuter = Math.exp(-Math.pow((ellipse-0.70d)/0.045d, 2d))*0.12d
                    double innerFade = 1d/(1d+Math.exp(-(ellipse-0.18d)*55d))
                    double outerFade = 1d/(1d+Math.exp((ellipse-0.79d)*40d))
                    double swirl = 0.57d + 0.43d*Math.sin(10d*Math.atan2(qy/tilt,qx) + ellipse*58d
                            + 1.8d*Math.sin(5d*Math.atan2(qy,qx)))
                    double doppler = 0.66d + 0.34d*Math.max(0d, Math.min(1d, 0.5d - qy/0.24d))
                    double disk = (ringCore + ringInner + ringOuter)*innerFade*outerFade*swirl*doppler

                    double halo = Math.exp(-Math.pow((ellipse-0.56d)/0.20d, 2d))*0.16d
                    double photonRing = Math.exp(-Math.pow((dist-0.188d)/0.008d, 2d))
                    double lensGlow = Math.exp(-Math.pow((dist-0.222d)/0.045d, 2d))*0.55d

                    // Low-contrast cosmic clouds keep the far sides from becoming flat black.
                    double cloudA = Math.sin(dx*17d + dy*23d + dz*11d)
                    double cloudB = Math.cos(dx*29d - dy*13d + dz*19d)
                    double nebula = Math.max(0d, (cloudA*cloudB + 0.22d))*0.5d
                    double baseR = 2d + nebula*5d + Math.max(0d,dy)*2d
                    double baseG = 3d + nebula*4d
                    double baseB = 9d + nebula*16d

                    double warm = disk*1.25d + photonRing*1.05d + lensGlow*0.38d
                    double violet = disk*0.62d + halo*0.84d + lensGlow*0.62d
                    double red = baseR + warm*248d + violet*82d
                    double green = baseG + warm*120d + violet*48d
                    double blue = baseB + warm*33d + violet*225d

                    // A clean, light-absorbing event horizon with a narrow photon ring.
                    if (dist < 0.174d) {
                        red = 0.25d; green = 0.35d; blue = 1.2d
                    } else if (dist < 0.205d) {
                        red = Math.max(red, 235d + photonRing*20d)
                        green = Math.max(green, 165d + photonRing*75d)
                        blue = Math.max(blue, 112d + photonRing*72d)
                    }

                    // Stable sparse star field, generated from the cubemap texel coordinates.
                    double hash = Math.abs(Math.sin((px + faceIndex*733)*127.1d
                            + (py + faceIndex*199)*311.7d)*43758.5453d)
                    double fract = hash - Math.floor(hash)
                    if (fract > 0.99972d && dist > 0.46d) {
                        double star = 115d + (fract-0.99972d)*950000d
                        red = Math.max(red, star)
                        green = Math.max(green, star*0.96d)
                        blue = Math.max(blue, star*1.05d)
                    }

                    int argb = (255 << 24) | (clampByte(red) << 16)
                            | (clampByte(green) << 8) | clampByte(blue)
                    atlas.setRGB(tileX*faceSize + px, tileY*faceSize + py, argb)
                }
            }
        }
        javax.imageio.ImageIO.write(atlas, "png", destination)
    }
}
def blackHoleAmbience = layout.buildDirectory.file("generated/provisuals-resources/assets/provisuals/sounds/black_hole_ambience.ogg")
def blackHoleSoundsJson = layout.buildDirectory.file("generated/provisuals-resources/assets/provisuals/sounds.json")

tasks.register("generateBlackHoleAmbience") {
    outputs.files(blackHoleAmbience, blackHoleSoundsJson)
    doLast {
        File audio = blackHoleAmbience.get().asFile
        File soundDefinitions = blackHoleSoundsJson.get().asFile
        audio.parentFile.mkdirs()
        soundDefinitions.parentFile.mkdirs()

        // Original 64-second two-channel synth drone. Every oscillator and modulation
        // completes an integer number of cycles, so the loop joins cleanly at the seam.
        String left = "0.105*sin(2*PI*55*t)+0.052*sin(2*PI*82.5*t+0.55*sin(2*PI*t/16))+0.038*sin(2*PI*110*t+0.32*sin(2*PI*t/32))+0.026*sin(2*PI*165*t+0.42*sin(2*PI*t/64))+0.019*sin(2*PI*220*t+0.22*sin(2*PI*t/16))+0.012*sin(2*PI*330*t+0.18*sin(2*PI*t/8))+0.009*sin(2*PI*293.75*t+0.2*sin(2*PI*t/32)"
        String right = "0.105*sin(2*PI*55*t+0.08)+0.052*sin(2*PI*82.5*t+0.55*sin(2*PI*t/16)+0.12)+0.038*sin(2*PI*110*t+0.32*sin(2*PI*t/32)+0.07)+0.026*sin(2*PI*165*t+0.42*sin(2*PI*t/64)+0.15)+0.019*sin(2*PI*220*t+0.22*sin(2*PI*t/16)+0.22)+0.012*sin(2*PI*330*t+0.18*sin(2*PI*t/8)+0.28)+0.009*sin(2*PI*293.75*t+0.2*sin(2*PI*t/32)+0.2"
        String source = "aevalsrc=" + left + "|" + right + ":s=48000:d=64"
        def command = [
                System.getenv("FFMPEG") ?: "ffmpeg",
                "-y", "-hide_banner", "-loglevel", "error",
                "-f", "lavfi", "-i", source,
                "-c:a", "libvorbis", "-q:a", "5",
                "-ar", "48000", "-ac", "2",
                "-metadata", "title=Event Horizon - ProVisuals Original Ambience",
                "-metadata", "artist=ProVisuals",
                audio.absolutePath
        ]
        Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
        String output = process.inputStream.getText("UTF-8")
        int exitCode = process.waitFor()
        if (exitCode != 0 || !audio.isFile() || audio.length() < 10000) {
            throw new GradleException("Could not generate Black Hole ambience with FFmpeg: " + output)
        }

        soundDefinitions.text = """{
  "black_hole_ambience": {
    "category": "music",
    "sounds": [
      { "name": "provisuals:black_hole_ambience", "stream": true }
    ]
  }
}
"""
    }
}

tasks.named("processResources").configure {
    dependsOn(tasks.named("downloadLyricsModule"), tasks.named("generateBlackHoleSkyTexture"),
            tasks.named("generateBlackHoleAmbience"))
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// The generated nested-mod resource is also inspected by the source archive task.
tasks.named("sourcesJar").configure {
    dependsOn(tasks.named("downloadLyricsModule"), tasks.named("generateBlackHoleSkyTexture"))
}
