name: PvP Mod Build

on:
  push:
    paths:
      - "PvPMod/**"
      - ".github/workflows/pvpmod-build.yml"
  pull_request:
    paths:
      - "PvPMod/**"
      - ".github/workflows/pvpmod-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - name: Build mod
        working-directory: PvPMod
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PvPMod-26.3-Fabric
          path: PvPMod/build/libs/*.jar
