name: Player Hotbar Display

on:
  push:
    branches:
      - feature/player-hotbar-display
    paths:
      - "PlayerHotbarDisplay/**"
      - ".github/workflows/player-hotbar-display.yml"
  pull_request:
    paths:
      - "PlayerHotbarDisplay/**"
      - ".github/workflows/player-hotbar-display.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: PlayerHotbarDisplay
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: player-hotbar-display
          path: PlayerHotbarDisplay/build/libs/*.jar
