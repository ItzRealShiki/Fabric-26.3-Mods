name: Build CoreMod

on:
  push:
    branches: [main]
    paths:
      - "CoreMod/**"
      - ".github/workflows/coremod-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build CoreMod
        working-directory: CoreMod
        run: gradle --no-daemon clean build
      - name: Verify JAR
        run: |
          set -euo pipefail
          test -f CoreMod/build/libs/coremod-0.1.0.jar
          jar tf CoreMod/build/libs/coremod-0.1.0.jar >/dev/null
      - name: Publish direct JAR download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view coremod-latest >/dev/null 2>&1; then
            gh release upload coremod-latest CoreMod/build/libs/coremod-0.1.0.jar --clobber
          else
            gh release create coremod-latest CoreMod/build/libs/coremod-0.1.0.jar \
              --title "CoreMod latest" --notes "Latest successful CoreMod build for Minecraft Java 26.3 / Fabric." \
              --prerelease --target "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CoreMod-0.1.0
          path: CoreMod/build/libs/coremod-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
