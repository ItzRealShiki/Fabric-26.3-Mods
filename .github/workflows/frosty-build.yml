name: Frosty Build

on:
  push:
    paths:
      - 'Frosty/**'
      - '.github/workflows/frosty-build.yml'
  pull_request:
    paths:
      - 'Frosty/**'
      - '.github/workflows/frosty-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Frosty
        working-directory: Frosty
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Frosty
          path: Frosty/build/libs/*.jar
