name: Build LifestealCore Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - 'LifestealCore-Mod 26.2/**'
      - '.github/workflows/build-lifestealcore-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifestealcore-fabric-mod-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build unchanged mod
        working-directory: 'LifestealCore-Mod 26.2'
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LifestealCore-Fabric-26.2
          path: |
            LifestealCore-Mod 26.2/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
