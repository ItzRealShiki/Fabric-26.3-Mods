name: PackManager Build

on:
  push:
    paths:
      - "PackManager/**"
      - ".github/workflows/packmanager-build.yml"
  pull_request:
    paths:
      - "PackManager/**"
      - ".github/workflows/packmanager-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build PackManager
        working-directory: PackManager
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PackManager
          path: PackManager/build/libs/*.jar
