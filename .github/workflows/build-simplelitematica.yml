name: Build SimpleLitematica
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimpleLitematica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLitematica-JAR
          path: SimpleLitematica/build/libs/*.jar
