# Build workflow for the Player Status HUD and its required PrivacyMod API.
# The HUD artifact is valid only when the required PrivacyMod API build succeeds.
name: Build Player Status HUD

on:
  push:
    paths:
      - "PlayerStatusHUD/**"
      - "scripts/**"
      - "PrivacyMod/**"
      - "scripts/**"
      - ".github/workflows/player-status-hud-build.yml"
  pull_request:
    paths:
      - "PlayerStatusHUD/**"
      - "PrivacyMod/**"
      - ".github/workflows/player-status-hud-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - name: Checkout ReGlass rendering library
        uses: actions/checkout@v4
        with:
          repository: RedxAx/ReGlass
          ref: master
          path: ReGlass
      - name: Restrict ReGlass to custom mod UI only
        working-directory: ReGlass
        run: python3 ../scripts/patch-reglass-mod-only.py
      - name: Build ReGlass 26.3
        working-directory: ReGlass
        run: |
          chmod +x ./gradlew
          ./gradlew :26.3:build
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"
      - name: Build required PrivacyMod API
        working-directory: PrivacyMod
        run: gradle build
      - name: Build Player Status HUD
        working-directory: PlayerStatusHUD
        run: gradle build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PlayerStatusHUD-26.3-Fabric
          path: PlayerStatusHUD/build/libs/*.jar
