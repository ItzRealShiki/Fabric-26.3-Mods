name: Build Privacy Mod

on:
  push:
    paths:
      - "PrivacyMod/**"
      - ".github/workflows/privacy-mod-build.yml"
  pull_request:
    paths:
      - "PrivacyMod/**"
      - ".github/workflows/privacy-mod-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - name: Checkout ReGlass rendering library
        uses: actions/checkout@v4
        with:
          repository: RedxAx/ReGlass
          ref: master
          path: ReGlass
      - name: Build ReGlass 26.3
        working-directory: ReGlass
        run: |
          chmod +x ./gradlew
          ./gradlew :26.3:build
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        working-directory: PrivacyMod
        run: gradle build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PrivacyMod-26.3-Fabric
          path: PrivacyMod/build/libs/*.jar
